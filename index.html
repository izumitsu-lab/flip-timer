<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flip Timer">
  
  <!-- ファビコン・アイコン設定 -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <title>Flip Timer</title>
  <style>
    :root {
      --app-height: 100vh;
    }

    /* 全体のリセットと背景設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      height: var(--app-height); /* iOS回転時の揺れを防ぐためCSS変数で制御 */
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* タイマーコンテナ */
    .timer-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 3vw; 
      transform: translateY(0); 
      transition: filter 0.5s ease, transform 0.5s ease;
    }

    body.settings-open .timer-container,
    body.option-open .timer-container {
      filter: blur(8px) brightness(0.5);
      transform: translateY(0) scale(0.95);
    }

    /* フリップユニット本体 */
    .flip-unit {
      position: relative;
      aspect-ratio: 1 / 1; 
      width: min(42vw, 68vh); 
      height: auto;
      perspective: 1200px;
      border-radius: 3cqmin; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      background-color: #000;
      container-type: inline-size;
      transition: width 0.3s ease;
    }

    @supports not (border-radius: 3cqmin) {
      .flip-unit { border-radius: 12px; }
      .top { border-radius: 12px 12px 0 0; }
      .bottom { border-radius: 0 0 12px 12px; }
    }

    /* 中央の切れ目 */
    .flip-unit::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: max(4px, 0.8cqmin); 
      background-color: #000000;
      transform: translateY(-50%);
      z-index: 10;
    }

    /* 上半分と下半分の基本スタイル */
    .top, .bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      background-color: #1a1a1a;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .top {
      top: 0;
      border-radius: 3cqmin 3cqmin 0 0;
      transform-origin: bottom;
    }

    .bottom {
      bottom: 0;
      border-radius: 0 0 3cqmin 3cqmin;
      transform-origin: top;
    }

    /* 数字のテキスト設定 */
    .top::after, .bottom::after {
      content: attr(data-val);
      position: absolute;
      left: 0;
      width: 100%;
      height: 200%; 
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 78cqi; 
      font-weight: 700;
      letter-spacing: -2px; 
      color: #f5f5f5;
      transition: font-size 0.3s ease;
    }

    .flip-unit.three-digits .top::after, 
    .flip-unit.three-digits .bottom::after {
      font-size: 55cqi;
      letter-spacing: -1px;
    }

    .top::after { top: 0; }
    .bottom::after { bottom: 0; }

    /* 立体感を出すためのグラデーションシャドウ */
    .top::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
      z-index: 1;
    }

    /* --- アニメーション用要素 --- */
    .flip-top {
      z-index: 5;
      animation: flipDownTop 0.25s ease-in forwards;
    }

    .flip-bottom {
      z-index: 5;
      transform: rotateX(90deg);
      animation: flipDownBottom 0.25s ease-out 0.25s forwards;
    }

    @keyframes flipDownTop {
      0% { transform: rotateX(0); filter: brightness(1); }
      100% { transform: rotateX(-90deg); filter: brightness(0.3); }
    }

    @keyframes flipDownBottom {
      0% { transform: rotateX(90deg); filter: brightness(0.3); }
      100% { transform: rotateX(0); filter: brightness(1); }
    }

    /* コロン */
    .colon {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: min(20vw, 35vh); 
      font-weight: 700;
      padding-bottom: 2%; 
      color: #1a1a1a;
      text-shadow: 0 0 10px rgba(255,255,255,0.1);
      animation: blink 1s infinite;
    }

    .paused .colon {
      animation: none;
      opacity: 1;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    /* --- 下部コントロールバー --- */
    .bottom-bar {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 10px) + 20px);
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5vw;
      z-index: 20;
      transition: opacity 0.5s ease;
    }

    body.settings-open .bottom-bar,
    body.option-open .bottom-bar,
    body.running .bottom-bar {
      opacity: 0;
      pointer-events: none;
    }

    /* トグルボタン共通スタイル */
    .ui-btn {
      font-size: clamp(13px, 2.2vh, 18px);
      font-weight: 300;
      letter-spacing: 2px;
      color: #666666;
      transition: color 0.3s ease, opacity 0.3s ease;
      padding: 8px 12px;
      cursor: pointer;
      text-align: center;
    }

    .ui-btn:hover {
      color: #aaaaaa;
    }

    .ui-btn.flash {
      color: #ffffff; 
    }

    /* =========================================
       ✨ フワッと浮かび上がるオーバーレイ共通
       ========================================= */
    .settings-overlay, .option-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    body.settings-open .settings-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    body.option-open .option-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    /* プリセット選択グリッド */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3vw;
      margin-bottom: 5vh;
    }

    .preset-btn {
      font-size: clamp(20px, 3.8vh, 34px);
      font-weight: 400;
      color: #f0f0f0;
      padding: 15px 25px;
      cursor: pointer;
      text-align: center;
      transition: color 0.3s ease, transform 0.1s ease;
      letter-spacing: 1px;
    }

    .preset-btn:active {
      color: #ffffff;
      transform: scale(0.95);
    }

    .custom-input-group {
      display: flex;
      align-items: center;
      gap: 2vw;
    }

    .custom-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #666;
      color: #ffffff;
      font-size: clamp(20px, 3.2vh, 30px);
      font-family: inherit;
      font-weight: 400;
      width: 90px;
      text-align: center;
      padding: 5px;
      outline: none;
    }

    .custom-input::-webkit-outer-spin-button,
    .custom-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .custom-btn {
      font-size: clamp(16px, 2.2vh, 22px);
      font-weight: 400;
      letter-spacing: 2px;
      color: #f0f0f0;
      cursor: pointer;
      padding: 10px 20px;
      transition: color 0.3s ease;
    }
    .custom-btn:active { color: #ffffff; }

    /* オプションメニュー用の内部スタイル */
    .option-content {
      display: flex;
      flex-direction: column;
      gap: 3vh;
      align-items: center;
    }

    .option-item {
      font-size: clamp(18px, 3.5vh, 28px);
      font-weight: 300;
      letter-spacing: 3px;
      color: #777777;
      cursor: pointer;
      padding: 10px 20px;
      transition: color 0.3s ease;
      text-align: center;
    }

    .option-item.active {
      color: #e0e0e0;
    }

    /* サウンド選択サブメニュー（SOUND: ON の時だけ展開） */
    .sound-select-group {
      display: none;
      flex-direction: column;
      gap: 1.5vh;
      align-items: center;
      margin-top: -1vh;
    }

    body.sound-on .sound-select-group {
      display: flex;
    }

    .sound-sub-item {
      font-size: clamp(14px, 2.5vh, 20px);
      font-weight: 300;
      letter-spacing: 2px;
      color: #555555;
      cursor: pointer;
      padding: 6px 16px;
      transition: color 0.3s ease;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 20px;
    }

    .sound-sub-item:hover {
      color: #888888;
    }

    .sound-sub-item.active {
      color: #ffffff;
      border-color: #444444;
      background: rgba(255, 255, 255, 0.05);
    }

    /* =========================================
       📱 スマホ縦画面（ポートレート）用の上書き設定
       ========================================= */
    @media (orientation: portrait) {
      .timer-container {
        flex-direction: column; 
        transform: translateY(-2vh); 
      }
      body.settings-open .timer-container,
      body.option-open .timer-container {
        transform: translateY(-2vh) scale(0.95);
      }
      .flip-unit {
        width: min(75vw, 32vh); 
      }
      .colon {
        display: none; 
      }
      
      .preset-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 5vw;
      }
    }
  </style>
</head>
<body class="paused" id="body" onclick="toggleTimer(event)">

  <div class="timer-container">
    <div class="flip-unit" id="min-unit">
      <div class="top" data-val="15"></div>
      <div class="bottom" data-val="15"></div>
    </div>
    <div class="colon">:</div>
    <div class="flip-unit" id="sec-unit">
      <div class="top" data-val="00"></div>
      <div class="bottom" data-val="00"></div>
    </div>
  </div>
  
  <!-- 下部コントロールバー -->
  <div class="bottom-bar">
    <div id="btn-reset" class="ui-btn" onclick="resetTimer(event)">RESET</div>
    <div id="btn-timer" class="ui-btn" onclick="openSettings(event)">TIMER</div>
    <div id="btn-option" class="ui-btn" onclick="openOption(event)">OPTION</div>
  </div>

  <!-- TIMER設定オーバーレイ -->
  <div id="settings-overlay" class="settings-overlay" onclick="closeSettings(event)">
    <div onclick="event.stopPropagation()" style="display:flex; flex-direction:column; align-items:center;">
      
      <div class="preset-grid">
        <div class="preset-btn" onclick="applyTime(1)">1</div>
        <div class="preset-btn" onclick="applyTime(2)">2</div>
        <div class="preset-btn" onclick="applyTime(3)">3</div>
        <div class="preset-btn" onclick="applyTime(5)">5</div>
        <div class="preset-btn" onclick="applyTime(10)">10</div>
        <div class="preset-btn" onclick="applyTime(15)">15</div>
        <div class="preset-btn" onclick="applyTime(20)">20</div>
        <div class="preset-btn" onclick="applyTime(25)">25</div>
        <div class="preset-btn" onclick="applyTime(30)">30</div>
        <div class="preset-btn" onclick="applyTime(45)">45</div>
        <div class="preset-btn" onclick="applyTime(60)">60</div>
        <div class="preset-btn" onclick="applyTime(90)">90</div>
      </div>

      <div class="custom-input-group">
        <input type="number" id="custom-min" class="custom-input" placeholder="---" min="1" max="999">
        <div class="custom-btn" onclick="applyCustomTime()">SET</div>
      </div>

    </div>
  </div>

  <!-- OPTION設定オーバーレイ -->
  <div id="option-overlay" class="option-overlay" onclick="closeOption(event)">
    <div class="option-content" onclick="event.stopPropagation()">
      <div id="btn-flip" class="option-item active" onclick="toggleFlip(event)">FLIP: ON</div>
      <div id="btn-sound" class="option-item" onclick="toggleSound(event)">SOUND: OFF</div>
      
      <!-- サウンド選択用サブメニュー (SOUND: ONのときに出現) -->
      <div class="sound-select-group">
        <div id="sound-bell" class="sound-sub-item active" onclick="setSoundType('bell', event)">REAL BELL</div>
        <div id="sound-chime" class="sound-sub-item" onclick="setSoundType('chime', event)">CHIME</div>
        <div id="sound-beep" class="sound-sub-item" onclick="setSoundType('beep', event)">BEEP</div>
      </div>
    </div>
  </div>

  <script>
    // iOSの回転時のレイアウト暴れ（ビヨビヨ）を防ぐための高さ再計算処理
    const setAppHeight = () => {
      document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    };
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', () => {
      setTimeout(setAppHeight, 150);
    });
    setAppHeight();

    // 初期設定
    let setMinutes = 15; 
    let timeLeft = setMinutes * 60;
    let isRunning = false;
    
    let isFlipEnabled = true;  
    let isSoundEnabled = false; 
    let selectedSound = 'bell'; // 'bell', 'chime', 'beep'
    
    let timerInterval;
    let audioCtx; 
    let resetTimeoutId;
    let bellAudio = new Audio('bell3sec.wav'); // bell3sec.wavの事前読み込み

    const bodyEl = document.getElementById('body');
    const minUnitEl = document.getElementById('min-unit');
    const btnFlip = document.getElementById('btn-flip');
    const btnSound = document.getElementById('btn-sound');
    const btnReset = document.getElementById('btn-reset');
    const customInput = document.getElementById('custom-min');

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 選択されたサウンドを実際に鳴らすテスト関数
    function playSelectedSound() {
      if (!isSoundEnabled) return;

      if (selectedSound === 'bell') {
        bellAudio.currentTime = 0;
        bellAudio.play().catch(e => console.log("Bell play error:", e));
      } else if (selectedSound === 'chime') {
        initAudio();
        playElegantChime();
      } else if (selectedSound === 'beep') {
        initAudio();
        playBeepSound();
      }
    }

    // デフォルトの美しいチャイム音
    function playElegantChime() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.value = 880; 

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.value = 1760; 

      gain1.gain.setValueAtTime(0, t);
      gain1.gain.linearRampToValueAtTime(0.5, t + 0.05); 
      gain1.gain.exponentialRampToValueAtTime(0.001, t + 3); 

      gain2.gain.setValueAtTime(0, t);
      gain2.gain.linearRampToValueAtTime(0.15, t + 0.05);
      gain2.gain.exponentialRampToValueAtTime(0.001, t + 2);

      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);

      osc1.start(t);
      osc1.stop(t + 3);
      osc2.start(t);
      osc2.stop(t + 2);
    }

    // シンプルな電子ビープ音
    function playBeepSound() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      for (let i = 0; i < 3; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = 659.25; // E5
        
        const startTime = t + i * 0.25;
        gain.gain.setValueAtTime(0.1, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + 0.15);
      }
    }

    function flip(unitId, newNumber) {
      const unit = document.getElementById(unitId);
      const top = unit.querySelector('.top:not(.flip-top)');
      const bottom = unit.querySelector('.bottom:not(.flip-bottom)');
      const currentNumber = top.getAttribute('data-val');
      
      if (currentNumber === newNumber) return;

      unit.querySelectorAll('.flip-top, .flip-bottom').forEach(el => el.remove());

      const flipTop = document.createElement('div');
      flipTop.className = 'top flip-top';
      flipTop.setAttribute('data-val', currentNumber);

      const flipBottom = document.createElement('div');
      flipBottom.className = 'bottom flip-bottom';
      flipBottom.setAttribute('data-val', newNumber);

      unit.appendChild(flipTop);
      unit.appendChild(flipBottom);

      top.setAttribute('data-val', newNumber);

      flipTop.addEventListener('animationend', () => {
        flipTop.remove();
      });

      flipBottom.addEventListener('animationend', () => {
        bottom.setAttribute('data-val', newNumber);
        flipBottom.remove();
      });
    }

    function updateDisplay(forceUpdate = false) {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const s = (timeLeft % 60).toString().padStart(2, '0');

      if (m.length >= 3) {
        minUnitEl.classList.add('three-digits');
      } else {
        minUnitEl.classList.remove('three-digits');
      }

      if (forceUpdate || !isFlipEnabled) {
        ['min-unit', 'sec-unit'].forEach(id => {
          const val = id === 'min-unit' ? m : s;
          const unit = document.getElementById(id);
          
          unit.querySelectorAll('.flip-top, .flip-bottom').forEach(el => el.remove());
          unit.querySelectorAll('.top, .bottom').forEach(el => el.setAttribute('data-val', val));
        });
      } else {
        flip('min-unit', m);
        flip('sec-unit', s);
      }
    }

    // TIMER設定の開閉
    function openSettings(event) {
      if (event) event.stopPropagation();
      if (isRunning) return;
      bodyEl.classList.add('settings-open');
      customInput.value = ''; 
    }

    function closeSettings(event) {
      if (event) event.stopPropagation();
      bodyEl.classList.remove('settings-open');
      customInput.blur();
    }

    // OPTION設定の開閉
    function openOption(event) {
      if (event) event.stopPropagation();
      bodyEl.classList.add('option-open');
    }

    function closeOption(event) {
      if (event) event.stopPropagation();
      bodyEl.classList.remove('option-open');
    }

    function applyTime(minutes) {
      setMinutes = minutes;
      timeLeft = setMinutes * 60;
      updateDisplay(true);
      closeSettings();
    }

    function applyCustomTime() {
      const val = parseInt(customInput.value, 10);
      if (!isNaN(val) && val > 0) {
        applyTime(val);
      } else {
        closeSettings();
      }
    }

    function resetTimer(event) {
      if (event) event.stopPropagation();
      if (isRunning) return;
      
      timeLeft = setMinutes * 60;
      updateDisplay(true);

      btnReset.textContent = "RESET";
      btnReset.classList.add('flash');
      clearTimeout(resetTimeoutId);
      resetTimeoutId = setTimeout(() => {
        btnReset.classList.remove('flash');
      }, 300);
    }

    function toggleTimer(event) {
      if (bodyEl.classList.contains('settings-open')) {
        closeSettings();
        return;
      }
      if (bodyEl.classList.contains('option-open')) {
        closeOption();
        return;
      }

      if (event && (
          event.target.closest('.bottom-bar') || 
          event.target.closest('.settings-overlay') ||
          event.target.closest('.option-overlay')
      )) {
        return;
      }

      initAudio();

      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        bodyEl.classList.add('paused');
        bodyEl.classList.remove('running');
      } else {
        if (timeLeft <= 0) return; 

        isRunning = true;
        bodyEl.classList.remove('paused');
        bodyEl.classList.add('running'); 
        
        timerInterval = setInterval(() => {
          timeLeft--;
          updateDisplay();

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            isRunning = false;
            bodyEl.classList.add('paused');
            bodyEl.classList.remove('running');
            
            // アラーム終了時のサウンド再生
            if (isSoundEnabled) {
              playSelectedSound();
            }
          }
        }, 1000);
      }
    }

    function toggleFlip(event) {
      if (event) event.stopPropagation();
      isFlipEnabled = !isFlipEnabled;
      
      btnFlip.textContent = isFlipEnabled ? "FLIP: ON" : "FLIP: OFF";
      if (isFlipEnabled) {
        btnFlip.classList.add('active');
      } else {
        btnFlip.classList.remove('active');
      }
    }

    function toggleSound(event) {
      if (event) event.stopPropagation();
      isSoundEnabled = !isSoundEnabled;
      
      if (isSoundEnabled) {
        btnSound.textContent = "SOUND: ON";
        btnSound.classList.add('active');
        bodyEl.classList.add('sound-on'); // サウンド選択メニューを表示
        initAudio();
        playSelectedSound(); // ONにした瞬間にテスト再生
      } else {
        btnSound.textContent = "SOUND: OFF";
        btnSound.classList.remove('active');
        bodyEl.classList.remove('sound-on'); // サウンド選択メニューを非表示
      }
    }

    function setSoundType(type, event) {
      if (event) event.stopPropagation();
      selectedSound = type;

      // アクティブ表示の切り替え
      document.querySelectorAll('.sound-sub-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`sound-${type}`).classList.add('active');

      initAudio();
      playSelectedSound(); // 変更して選んだ瞬間にテスト再生
    }

    updateDisplay(true);
  </script>
</body>
</html>
