<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flip Timer">
  
  <!-- ファビコン・アイコン設定 -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <title>Flip Timer</title>
  <style>
    :root {
      --app-height: 100vh;
    }

    /* 全体のリセットと背景設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      height: var(--app-height);
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* タイマーコンテナ（ここをクリックした時だけスタート・ポーズ） */
    .timer-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 3vw; 
      transform: translateY(0); 
      transition: filter 0.5s ease, transform 0.5s ease;
      cursor: pointer;
    }

    body.settings-open .timer-container,
    body.option-open .timer-container,
    body.custom-open .timer-container {
      filter: blur(8px) brightness(0.5);
      transform: translateY(0) scale(0.95);
    }

    /* フリップユニット本体 */
    .flip-unit {
      position: relative;
      aspect-ratio: 1 / 1; 
      width: min(42vw, 68vh); 
      height: auto;
      perspective: 1200px;
      border-radius: 3cqmin; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      background-color: #000;
      container-type: inline-size;
      transition: width 0.3s ease;
    }

    @supports not (border-radius: 3cqmin) {
      .flip-unit { border-radius: 12px; }
      .top { border-radius: 12px 12px 0 0; }
      .bottom { border-radius: 0 0 12px 12px; }
    }

    /* 中央の切れ目 */
    .flip-unit::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: max(4px, 0.8cqmin); 
      background-color: #000000;
      transform: translateY(-50%);
      z-index: 10;
    }

    /* 上半分と下半分の基本スタイル */
    .top, .bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      background-color: #1a1a1a;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .top {
      top: 0;
      border-radius: 3cqmin 3cqmin 0 0;
      transform-origin: bottom;
    }

    .bottom {
      bottom: 0;
      border-radius: 0 0 3cqmin 3cqmin;
      transform-origin: top;
    }

    /* 数字のテキスト設定 */
    .top::after, .bottom::after {
      content: attr(data-val);
      position: absolute;
      left: 0;
      width: 100%;
      height: 200%; 
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 78cqi; 
      font-weight: 700;
      letter-spacing: -2px; 
      color: #f5f5f5;
      transition: font-size 0.3s ease;
    }

    .flip-unit.three-digits .top::after, 
    .flip-unit.three-digits .bottom::after {
      font-size: 55cqi;
      letter-spacing: -1px;
    }

    .top::after { top: 0; }
    .bottom::after { bottom: 0; }

    .top::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
      z-index: 1;
    }

    /* --- アニメーション用要素 --- */
    .flip-top {
      z-index: 5;
      animation: flipDownTop 0.25s ease-in forwards;
    }

    .flip-bottom {
      z-index: 5;
      transform: rotateX(90deg);
      animation: flipDownBottom 0.25s ease-out 0.25s forwards;
    }

    @keyframes flipDownTop {
      0% { transform: rotateX(0); filter: brightness(1); }
      100% { transform: rotateX(-90deg); filter: brightness(0.3); }
    }

    @keyframes flipDownBottom {
      0% { transform: rotateX(90deg); filter: brightness(0.3); }
      100% { transform: rotateX(0); filter: brightness(1); }
    }

    /* コロン */
    .colon {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: min(20vw, 35vh); 
      font-weight: 700;
      padding-bottom: 2%; 
      color: #1a1a1a;
      text-shadow: 0 0 10px rgba(255,255,255,0.1);
      animation: blink 1s infinite;
    }

    .paused .colon {
      animation: none;
      opacity: 1;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    /* --- 下部コントロールバー --- */
    .bottom-bar {
      position: absolute;
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5vw;
      z-index: 20;
      transition: opacity 0.5s ease;
    }

    body.settings-open .bottom-bar,
    body.option-open .bottom-bar,
    body.custom-open .bottom-bar,
    body.running .bottom-bar {
      opacity: 0;
      pointer-events: none;
    }

    .ui-btn {
      font-size: clamp(15px, 2.2vh, 20px);
      font-weight: 400;
      letter-spacing: 2px;
      color: #777777;
      transition: color 0.3s ease, opacity 0.3s ease;
      padding: 10px 18px;
      cursor: pointer;
      text-align: center;
    }

    .ui-btn:hover {
      color: #bbbbbb;
    }

    .ui-btn.active-mode {
      color: #e0e0e0;
    }

    /* =========================================
       ✨ オーバーレイ共通
       ========================================= */
    .settings-overlay, .option-overlay, .custom-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    body.settings-open .settings-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    body.option-open .option-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    body.custom-open .custom-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    /* プリセット選択グリッド */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2.5vw;
      margin-bottom: 2.5vh;
      max-width: 440px;
    }

    .preset-btn {
      font-size: clamp(18px, 3.2vh, 28px);
      font-weight: 400;
      color: #f0f0f0;
      padding: 10px 18px;
      cursor: pointer;
      text-align: center;
      transition: color 0.3s ease, transform 0.1s ease;
      letter-spacing: 1px;
    }

    .preset-btn:active {
      color: #ffffff;
      transform: scale(0.95);
    }

    .timer-menu-footer {
      display: flex;
      gap: 4vw;
      margin-top: 1vh;
    }

    .sub-menu-btn {
      font-size: clamp(14px, 2.2vh, 18px);
      font-weight: 300;
      letter-spacing: 2px;
      color: #888888;
      cursor: pointer;
      padding: 8px 16px;
      transition: color 0.3s ease;
    }

    .sub-menu-btn:hover {
      color: #ffffff;
    }

    .sub-menu-btn.flash {
      color: #ffffff;
    }

    /* =========================================
       🔢 カスタムテンキー用のスタイル
       ========================================= */
    .custom-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 300px;
      padding: 0 20px;
    }

    .custom-display {
      font-size: clamp(36px, 7vh, 56px);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
      margin-bottom: 2vh;
      height: 1.2em;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 2px solid #444444;
      width: 100%;
      padding-bottom: 1vh;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin-bottom: 2vh;
    }

    .key-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #ffffff;
      font-size: clamp(22px, 4vh, 30px);
      font-weight: 400;
      aspect-ratio: 1.5 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .key-btn:active {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0.93);
    }

    .key-btn.action-key {
      font-size: clamp(16px, 3vh, 20px);
      color: #aaaaaa;
      background: rgba(255, 255, 255, 0.02);
    }

    .custom-set-btn {
      width: 100%;
      background: #e0e0e0;
      color: #000000;
      font-size: clamp(16px, 2.8vh, 22px);
      font-weight: 700;
      letter-spacing: 3px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      margin-bottom: 2vh;
    }

    .custom-set-btn:active {
      opacity: 0.8;
      transform: scale(0.97);
    }

    .mode-toggle-btn {
      font-size: clamp(12px, 2vh, 15px);
      font-weight: 300;
      letter-spacing: 2px;
      color: #777777;
      cursor: pointer;
      transition: color 0.3s ease;
      text-align: center;
    }

    .mode-toggle-btn:hover {
      color: #cccccc;
    }

    .option-content {
      display: flex;
      flex-direction: column;
      gap: 3vh;
      align-items: center;
    }

    .option-item {
      font-size: clamp(18px, 3.5vh, 28px);
      font-weight: 300;
      letter-spacing: 3px;
      color: #777777;
      cursor: pointer;
      padding: 10px 20px;
      transition: color 0.3s ease;
      text-align: center;
    }

    .option-item.active {
      color: #e0e0e0;
    }

    .sound-select-group {
      display: none;
      flex-direction: column;
      gap: 1.5vh;
      align-items: center;
      margin-top: -1vh;
    }

    body.sound-on .sound-select-group {
      display: flex;
    }

    .sound-sub-item {
      font-size: clamp(14px, 2.5vh, 20px);
      font-weight: 300;
      letter-spacing: 2px;
      color: #555555;
      cursor: pointer;
      padding: 6px 16px;
      transition: color 0.3s ease;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 20px;
    }

    .sound-sub-item:hover {
      color: #888888;
    }

    .sound-sub-item.active {
      color: #ffffff;
      border-color: #444444;
      background: rgba(255, 255, 255, 0.05);
    }

    /* =========================================
       📱 スマホ縦画面（ポートレート）用の上書き設定
       ========================================= */
    @media (orientation: portrait) {
      .timer-container {
        flex-direction: column; 
        transform: translateY(-3vh); 
      }
      body.settings-open .timer-container,
      body.option-open .timer-container,
      body.custom-open .timer-container {
        transform: translateY(-3vh) scale(0.95);
      }
      .flip-unit {
        width: min(72vw, 30vh); 
      }
      .colon {
        display: none; 
      }
      
      .preset-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 3vw;
      }
      
      .bottom-bar {
        gap: 6vw;
      }
    }
  </style>
</head>
<body class="paused sound-on" id="body">

  <!-- パタパタ時計部分を囲むコンテナをクリックした時だけタイマーが始動します -->
  <div class="timer-container" onclick="toggleTimer(event)">
    <div class="flip-unit" id="min-unit">
      <div class="top" data-val="25"></div>
      <div class="bottom" data-val="25"></div>
    </div>
    <div class="colon">:</div>
    <div class="flip-unit" id="sec-unit">
      <div class="top" data-val="00"></div>
      <div class="bottom" data-val="00"></div>
    </div>
  </div>
  
  <!-- 下部コントロールバー（CHRONO / TIMER / OPTION） -->
  <div class="bottom-bar">
    <div id="btn-chrono" class="ui-btn" onclick="switchToChrono(event)">CHRONO</div>
    <div id="btn-timer" class="ui-btn active-mode" onclick="handleTimerClick(event)">TIMER</div>
    <div id="btn-option" class="ui-btn" onclick="openOption(event)">OPTION</div>
  </div>

  <!-- TIMER設定オーバーレイ -->
  <div id="settings-overlay" class="settings-overlay" onclick="closeSettings(event)">
    <div onclick="event.stopPropagation()" style="display:flex; flex-direction:column; align-items:center;">
      
      <div class="preset-grid">
        <div class="preset-btn" onclick="applyTime(1)">1</div>
        <div class="preset-btn" onclick="applyTime(2)">2</div>
        <div class="preset-btn" onclick="applyTime(3)">3</div>
        <div class="preset-btn" onclick="applyTime(5)">5</div>
        <div class="preset-btn" onclick="applyTime(10)">10</div>
        <div class="preset-btn" onclick="applyTime(15)">15</div>
        <div class="preset-btn" onclick="applyTime(20)">20</div>
        <div class="preset-btn" onclick="applyTime(25)">25</div>
        <div class="preset-btn" onclick="applyTime(30)">30</div>
        <div class="preset-btn" onclick="applyTime(45)">45</div>
        <div class="preset-btn" onclick="applyTime(60)">60</div>
        <div class="preset-btn" onclick="applyTime(90)">90</div>
      </div>

      <div class="timer-menu-footer">
        <div id="btn-reset" class="sub-menu-btn" onclick="resetTimer(event)">RESET</div>
        <div class="sub-menu-btn" onclick="openCustomInput(event)">CUSTOM</div>
      </div>

    </div>
  </div>

  <!-- カスタムテンキー入力オーバーレイ -->
  <div id="custom-overlay" class="custom-overlay" onclick="closeCustomInput(event)">
    <div class="custom-container" onclick="event.stopPropagation()">
      <div id="custom-display" class="custom-display">0</div>
      
      <div class="keypad-grid">
        <div class="key-btn" onclick="appendKey('1')">1</div>
        <div class="key-btn" onclick="appendKey('2')">2</div>
        <div class="key-btn" onclick="appendKey('3')">3</div>
        <div class="key-btn" onclick="appendKey('4')">4</div>
        <div class="key-btn" onclick="appendKey('5')">5</div>
        <div class="key-btn" onclick="appendKey('6')">6</div>
        <div class="key-btn" onclick="appendKey('7')">7</div>
        <div class="key-btn" onclick="appendKey('8')">8</div>
        <div class="key-btn" onclick="appendKey('9')">9</div>
        <div class="key-btn action-key" onclick="clearKeypad()">C</div>
        <div class="key-btn" onclick="appendKey('0')">0</div>
        <div class="key-btn action-key" onclick="deleteKey()">⌫</div>
      </div>

      <div class="custom-set-btn" onclick="applyCustomTime()">SET</div>
      <div id="mode-toggle-link" class="mode-toggle-btn" onclick="toggleInputMode()">+ SWITCH TO MM:SS</div>
    </div>
  </div>

  <!-- OPTION設定オーバーレイ -->
  <div id="option-overlay" class="option-overlay" onclick="closeOption(event)">
    <div class="option-content" onclick="event.stopPropagation()">
      <div id="btn-flip" class="option-item active" onclick="toggleFlip(event)">FLIP: ON</div>
      <div id="btn-sound" class="option-item active" onclick="toggleSound(event)">SOUND: ON</div>
      
      <!-- サウンド選択用サブメニュー -->
      <div class="sound-select-group">
        <div id="sound-bell" class="sound-sub-item active" onclick="setSoundType('bell', event)">REAL BELL</div>
        <div id="sound-chime" class="sound-sub-item" onclick="setSoundType('chime', event)">CHIME</div>
        <div id="sound-beep" class="sound-sub-item" onclick="setSoundType('beep', event)">BEEP</div>
      </div>
    </div>
  </div>

  <script>
    // iOSの回転時のレイアウト暴れを防ぐ高さ調整
    const setAppHeight = () => {
      document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    };
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', () => {
      setTimeout(setAppHeight, 150);
    });
    setAppHeight();

    // モード・時間設定
    let mode = 'timer'; 
    let setMinutes = 25; 
    let timeLeft = setMinutes * 60; 
    let chronoSeconds = 0;        
    let isRunning = false;
    
    // タイムスタンプ管理用変数
    let targetTimestamp = 0;   
    let startEpoch = 0;        
    let elapsedBeforePause = 0; 
    
    // 💡 設定値の初期状態を localStorage から復元（なければデフォルト値）
    let isFlipEnabled = localStorage.getItem('isFlipEnabled') !== null ? JSON.parse(localStorage.getItem('isFlipEnabled')) : true;  
    let isSoundEnabled = localStorage.getItem('isSoundEnabled') !== null ? JSON.parse(localStorage.getItem('isSoundEnabled')) : true; 
    let selectedSound = localStorage.getItem('selectedSound') || 'bell'; 
    
    let timerInterval;
    let audioCtx; 
    let resetTimeoutId;
    let bellAudio = new Audio('bell3sec.wav');

    // テンキー入力用変数
    let customInputBuffer = "";
    let customInputMode = localStorage.getItem('customInputMode') || 'minutes';

    const bodyEl = document.getElementById('body');
    const minUnitEl = document.getElementById('min-unit');
    const btnTimer = document.getElementById('btn-timer');
    const btnChrono = document.getElementById('btn-chrono');
    const btnFlip = document.getElementById('btn-flip');
    const btnSound = document.getElementById('btn-sound');
    const btnReset = document.getElementById('btn-reset');
    const customDisplayEl = document.getElementById('custom-display');
    const modeToggleLink = document.getElementById('mode-toggle-link');

    // 💡 起動時に保存されたOPTION設定をDOMやクラスに反映させる初期化処理
    function applySavedOptionsToUI() {
      // FLIPの反映
      if (isFlipEnabled) {
        btnFlip.textContent = "FLIP: ON";
        btnFlip.classList.add('active');
      } else {
        btnFlip.textContent = "FLIP: OFF";
        btnFlip.classList.remove('active');
      }

      // SOUNDの反映
      if (isSoundEnabled) {
        btnSound.textContent = "SOUND: ON";
        btnSound.classList.add('active');
        bodyEl.classList.add('sound-on');
      } else {
        btnSound.textContent = "SOUND: OFF";
        btnSound.classList.remove('active');
        bodyEl.classList.remove('sound-on');
      }

      // サウンドタイプの反映
      document.querySelectorAll('.sound-sub-item').forEach(el => el.classList.remove('active'));
      const activeSoundEl = document.getElementById(`sound-${selectedSound}`);
      if (activeSoundEl) {
        activeSoundEl.classList.add('active');
      }
    }

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSelectedSound() {
      if (!isSoundEnabled) return;
      if (selectedSound === 'bell') {
        bellAudio.currentTime = 0;
        bellAudio.play().catch(e => console.log("Bell play error:", e));
      } else if (selectedSound === 'chime') {
        initAudio();
        playElegantChime();
      } else if (selectedSound === 'beep') {
        initAudio();
        playBeepSound();
      }
    }

    function playElegantChime() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.value = 880; 

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.value = 1760; 

      gain1.gain.setValueAtTime(0, t);
      gain1.gain.linearRampToValueAtTime(0.5, t + 0.05); 
      gain1.gain.exponentialRampToValueAtTime(0.001, t + 3); 

      gain2.gain.setValueAtTime(0, t);
      gain2.gain.linearRampToValueAtTime(0.15, t + 0.05);
      gain2.gain.exponentialRampToValueAtTime(0.001, t + 2);

      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);

      osc1.start(t);
      osc1.stop(t + 3);
      osc2.start(t);
      osc2.stop(t + 2);
    }

    function playBeepSound() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      for (let i = 0; i < 3; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = 659.25; 
        
        const startTime = t + i * 0.25;
        gain.gain.setValueAtTime(0.1, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + 0.15);
      }
    }

    function flip(unitId, newNumber) {
      const unit = document.getElementById(unitId);
      const top = unit.querySelector('.top:not(.flip-top)');
      const bottom = unit.querySelector('.bottom:not(.flip-bottom)');
      const currentNumber = top.getAttribute('data-val');
      
      if (currentNumber === newNumber) return;

      unit.querySelectorAll('.flip-top, .flip-bottom').forEach(el => el.remove());

      const flipTop = document.createElement('div');
      flipTop.className = 'top flip-top';
      flipTop.setAttribute('data-val', currentNumber);

      const flipBottom = document.createElement('div');
      flipBottom.className = 'bottom flip-bottom';
      flipBottom.setAttribute('data-val', newNumber);

      unit.appendChild(flipTop);
      unit.appendChild(flipBottom);

      top.setAttribute('data-val', newNumber);

      flipTop.addEventListener('animationend', () => flipTop.remove());
      flipBottom.addEventListener('animationend', () => {
        bottom.setAttribute('data-val', newNumber);
        flipBottom.remove();
      });
    }

    function updateDisplay(forceUpdate = false) {
      let currentSeconds = (mode === 'timer') ? timeLeft : chronoSeconds;

      const m = Math.floor(currentSeconds / 60).toString().padStart(2, '0');
      const s = (currentSeconds % 60).toString().padStart(2, '0');

      if (m.length >= 3) {
        minUnitEl.classList.add('three-digits');
      } else {
        minUnitEl.classList.remove('three-digits');
      }

      if (forceUpdate || !isFlipEnabled) {
        ['min-unit', 'sec-unit'].forEach(id => {
          const val = id === 'min-unit' ? m : s;
          const unit = document.getElementById(id);
          
          unit.querySelectorAll('.flip-top, .flip-bottom').forEach(el => el.remove());
          unit.querySelectorAll('.top, .bottom').forEach(el => el.setAttribute('data-val', val));
        });
      } else {
        flip('min-unit', m);
        flip('sec-unit', s);
      }
    }

    function checkTimeAndTick() {
      const now = Date.now();

      if (mode === 'timer') {
        const diffMs = targetTimestamp - now;
        timeLeft = Math.max(0, Math.ceil(diffMs / 1000));
        updateDisplay();

        if (timeLeft <= 0) {
          stopTimer();
          if (isSoundEnabled) {
            playSelectedSound();
          }
        }
      } else {
        const diffMs = now - startEpoch;
        chronoSeconds = Math.min(5999, Math.floor(diffMs / 1000));
        updateDisplay();
      }
    }

    function handleTimerClick(event) {
      if (event) event.stopPropagation();
      if (isRunning) return;

      if (mode === 'chrono') {
        mode = 'timer';
        btnTimer.classList.add('active-mode');
        btnChrono.classList.remove('active-mode');
        updateDisplay(true);
      } else {
        openSettings(event);
      }
    }

    function switchToChrono(event) {
      if (event) event.stopPropagation();
      if (isRunning) return;

      mode = 'chrono';
      chronoSeconds = 0;
      elapsedBeforePause = 0;
      btnChrono.classList.add('active-mode');
      btnTimer.classList.remove('active-mode');
      updateDisplay(true);
    }

    function openSettings(event) {
      if (event) event.stopPropagation();
      if (isRunning || mode === 'chrono') return;
      bodyEl.classList.add('settings-open');
    }

    function closeSettings(event) {
      if (event) event.stopPropagation();
      bodyEl.classList.remove('settings-open');
    }

    function openOption(event) {
      if (event) event.stopPropagation();
      bodyEl.classList.add('option-open');
    }

    function closeOption(event) {
      if (event) event.stopPropagation();
      bodyEl.classList.remove('option-open');
    }

    function openCustomInput(event) {
      if (event) event.stopPropagation();
      bodyEl.classList.remove('settings-open');
      bodyEl.classList.add('custom-open');
      customInputBuffer = "";
      
      customInputMode = localStorage.getItem('customInputMode') || 'minutes';
      if (customInputMode === 'mmss') {
        modeToggleLink.textContent = "- SWITCH TO MINUTES";
      } else {
        modeToggleLink.textContent = "+ SWITCH TO MM:SS";
      }

      updateCustomDisplay();
    }

    function closeCustomInput(event) {
      if (event) event.stopPropagation();
      bodyEl.classList.remove('custom-open');
    }

    function toggleInputMode() {
      if (customInputMode === 'minutes') {
        customInputMode = 'mmss';
        modeToggleLink.textContent = "- SWITCH TO MINUTES";
      } else {
        customInputMode = 'minutes';
        modeToggleLink.textContent = "+ SWITCH TO MM:SS";
      }
      
      localStorage.setItem('customInputMode', customInputMode);

      customInputBuffer = "";
      updateCustomDisplay();
    }

    function appendKey(numStr) {
      const limit = customInputMode === 'minutes' ? 3 : 4; 
      if (customInputBuffer.length >= limit) return;
      
      if (customInputBuffer === "0") {
        customInputBuffer = numStr;
      } else {
        customInputBuffer += numStr;
      }
      updateCustomDisplay();
    }

    function clearKeypad() {
      customInputBuffer = "";
      updateCustomDisplay();
    }

    function deleteKey() {
      customInputBuffer = customInputBuffer.slice(0, -1);
      updateCustomDisplay();
    }

    function updateCustomDisplay() {
      if (customInputBuffer === "") {
        customDisplayEl.textContent = customInputMode === 'minutes' ? "0" : "00:00";
        return;
      }

      if (customInputMode === 'minutes') {
        customDisplayEl.textContent = customInputBuffer;
      } else {
        let padded = customInputBuffer.padStart(4, '0');
        let m = padded.slice(0, 2);
        let s = padded.slice(2, 4);
        customDisplayEl.textContent = `${m}:${s}`;
      }
    }

    function applyTime(minutes, seconds = 0) {
      setMinutes = minutes;
      timeLeft = (minutes * 60) + seconds;
      elapsedBeforePause = 0;
      updateDisplay(true);
      closeSettings();
    }

    function applyCustomTime() {
      if (customInputBuffer === "") {
        closeCustomInput();
        return;
      }

      if (customInputMode === 'minutes') {
        const val = parseInt(customInputBuffer, 10);
        if (!isNaN(val) && val > 0) {
          applyTime(val, 0);
        }
      } else {
        let padded = customInputBuffer.padStart(4, '0');
        let m = parseInt(padded.slice(0, 2), 10);
        let s = parseInt(padded.slice(2, 4), 10);
        let totalSeconds = (m * 60) + s;
        if (totalSeconds > 0) {
          applyTime(0, totalSeconds);
        }
      }
      closeCustomInput();
    }

    function resetTimer(event) {
      if (event) event.stopPropagation();
      if (isRunning) return;
      
      if (mode === 'timer') {
        timeLeft = setMinutes * 60;
      } else {
        chronoSeconds = 0;
      }
      elapsedBeforePause = 0;
      updateDisplay(true);

      btnReset.textContent = "RESET";
      btnReset.classList.add('flash');
      clearTimeout(resetTimeoutId);
      resetTimeoutId = setTimeout(() => {
        btnReset.classList.remove('flash');
      }, 300);
      closeSettings(event);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      bodyEl.classList.add('paused');
      bodyEl.classList.remove('running');
      if (mode === 'chrono') {
        elapsedBeforePause = chronoSeconds;
      }
    }

    function toggleTimer(event) {
      if (event) event.stopPropagation();

      initAudio();

      if (isRunning) {
        stopTimer();
      } else {
        if (mode === 'timer' && timeLeft <= 0) return; 

        isRunning = true;
        bodyEl.classList.remove('paused');
        bodyEl.classList.add('running'); 
        
        const now = Date.now();
        if (mode === 'timer') {
          targetTimestamp = now + (timeLeft * 1000);
        } else {
          startEpoch = now - (elapsedBeforePause * 1000);
        }
        
        checkTimeAndTick();
        timerInterval = setInterval(checkTimeAndTick, 250);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isRunning) {
        checkTimeAndTick();
      }
    });

    // 💡 FLIP設定切り替え＆localStorage保存
    function toggleFlip(event) {
      if (event) event.stopPropagation();
      isFlipEnabled = !isFlipEnabled;
      btnFlip.textContent = isFlipEnabled ? "FLIP: ON" : "FLIP: OFF";
      if (isFlipEnabled) btnFlip.classList.add('active');
      else btnFlip.classList.remove('active');

      localStorage.setItem('isFlipEnabled', isFlipEnabled);
    }

    // 💡 SOUND設定切り替え＆localStorage保存
    function toggleSound(event) {
      if (event) event.stopPropagation();
      isSoundEnabled = !isSoundEnabled;
      
      if (isSoundEnabled) {
        btnSound.textContent = "SOUND: ON";
        btnSound.classList.add('active');
        bodyEl.classList.add('sound-on');
        initAudio();
        playSelectedSound();
      } else {
        btnSound.textContent = "SOUND: OFF";
        btnSound.classList.remove('active');
        bodyEl.classList.remove('sound-on');
      }

      localStorage.setItem('isSoundEnabled', isSoundEnabled);
    }

    // 💡 サウンド種類選択＆localStorage保存
    function setSoundType(type, event) {
      if (event) event.stopPropagation();
      selectedSound = type;

      document.querySelectorAll('.sound-sub-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`sound-${type}`).classList.add('active');

      localStorage.setItem('selectedSound', selectedSound);

      initAudio();
      playSelectedSound();
    }

    // アプリ起動時に保存されたオプションを適用
    applySavedOptionsToUI();
    updateDisplay(true);
  </script>
</body>
</html>
